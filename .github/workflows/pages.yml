name: Deploy 5Dollar Guy to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Mirror and prepare the original animated site
        run: |
          python3 - <<'PY'
          import re, urllib.request
          from pathlib import Path
          origin = "https://5dollar-guy.higgsfield.app"
          out = Path("site")
          out.mkdir(exist_ok=True)
          if Path("assets").exists():
              import shutil
              shutil.copytree("assets", out / "assets", dirs_exist_ok=True)
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read()
          def fetch_asset(path):
              path = path.split("?", 1)[0]
              if not path.startswith("/assets/"):
                  return
              target = out / path.lstrip("/")
              if target.exists() and target.stat().st_size > 100:
                  return
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(get(origin + path))
          html = get(origin + "/").decode("utf-8", errors="replace")
          pattern = re.compile(r"/assets/[A-Za-z0-9_./-]+")
          for _ in range(15):
              before = sum(1 for p in out.rglob("*") if p.is_file())
              refs = set(pattern.findall(html))
              for p in out.rglob("*"):
                  if p.is_file() and p.suffix.lower() in {".js", ".css", ".svg", ".webmanifest"}:
                      try:
                          refs.update(pattern.findall(p.read_text(errors="ignore")))
                      except Exception:
                          pass
              for ref in sorted(refs):
                  fetch_asset(ref)
              after = sum(1 for p in out.rglob("*") if p.is_file())
              if after == before:
                  break
          # Copy the original scene videos and poster images explicitly.
          for asset in [
              "/assets/world/scene-01.mp4",
              "/assets/world/scene-01-mobile.mp4",
              "/assets/world/scene-01-desktop-poster.png",
              "/assets/world/scene-01-mobile-poster.png",
          ]:
              fetch_asset(asset)
          # The source host exposes a development-mode TanStack entry; remove it and load the
          # production Vite client bundle plus its compiled CSS instead.
          html = re.sub(r'<script[^>]+src=["\']/@id/virtual:tanstack-start-dev-client-entry["\'][^>]*></script>', "", html)
          html = re.sub(r'<link[^>]+data-tanstack-router-dev-styles[^>]*>', "", html)
          html = re.sub(r'<script[^>]+src=["\']/@vite/client["\'][^>]*></script>', "", html)
          base = "/5dollarguy"
          html = html.replace('src="/assets/', 'src="' + base + '/assets/')
          html = html.replace('href="/assets/', 'href="' + base + '/assets/')
          html = html.replace('poster="/assets/', 'poster="' + base + '/assets/')
          html = html.replace('"/assets/', '"' + base + '/assets/')
          html = html.replace("'/assets/", "'" + base + "/assets/")
          # Root-relative paths in compiled bundles/CSS must also point into the Pages subpath.
          for p in out.rglob("*"):
              if p.is_file() and p.suffix.lower() in {".js", ".css", ".svg", ".webmanifest"}:
                  try:
                      data = p.read_text()
                      data = data.replace('"/assets/', '"' + base + '/assets/')
                      data = data.replace("'/assets/", "'" + base + "/assets/")
                      p.write_text(data)
                  except UnicodeDecodeError:
                      pass
          # Use the known production entry/CSS; avoid duplicate script tags.
          html = re.sub(r'<script[^>]+src=["\']' + re.escape(base) + r'/assets/index-[^"\']+\.js["\'][^>]*></script>', "", html)
          inject = (
              '<link rel="stylesheet" href="' + base + '/assets/styles-B4Eet8Za.css">'
              '<link rel="stylesheet" href="' + base + '/assets/routes-CNXtvISG.css">'
              '<script type="module" src="' + base + '/assets/index-DCwGVO_i.js"></script>'
          )
          html = html.replace("</head>", inject + "</head>")
          (out / "index.html").write_text(html)
          assert (out / "index.html").stat().st_size > 1000
          assert (out / "assets/world/scene-01.mp4").stat().st_size > 100000
          assert (out / "assets/world/scene-01-mobile.mp4").stat().st_size > 100000
          assert "/@id/virtual:tanstack-start-dev-client-entry" not in html
          print("Prepared", sum(1 for p in out.rglob("*") if p.is_file()), "files")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
