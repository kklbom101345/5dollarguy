name: Deploy 5Dollar Guy to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Mirror the original site and its runtime assets
        run: |
          python3 - <<'PY'
          import re, urllib.request
          from pathlib import Path
          origin = "https://5dollar-guy.higgsfield.app"
          out = Path("site")
          out.mkdir(exist_ok=True)
          def fetch(path):
              path = path.split("?", 1)[0]
              if not path.startswith("/assets/"):
                  return None
              target = out / path.lstrip("/")
              if target.exists():
                  return target
              target.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(origin + path, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  target.write_bytes(response.read())
              return target
          req = urllib.request.Request(origin + "/", headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              (out / "index.html").write_bytes(response.read())
          pattern = re.compile(r"/assets/[A-Za-z0-9_./-]+")
          for _ in range(12):
              found = set()
              for p in out.rglob("*"):
                  if p.is_file() and p.suffix.lower() in {".html", ".js", ".css", ".svg", ".webmanifest"}:
                      try:
                          found.update(pattern.findall(p.read_text(errors="ignore")))
                      except Exception:
                          pass
              before = sum(1 for p in out.rglob("*") if p.is_file())
              for asset in sorted(found):
                  fetch(asset)
              after = sum(1 for p in out.rglob("*") if p.is_file())
              if after == before:
                  break
          # Ensure any assets referenced dynamically by the scroll-scrub scene exist locally.
          for asset in [
              "/assets/world/scene-01.mp4",
              "/assets/world/scene-01-mobile.mp4",
              "/assets/world/scene-01-desktop-poster.png",
              "/assets/world/scene-01-mobile-poster.png",
          ]:
              fetch(asset)
          # Rewrite root-relative asset paths to this repository's Pages subpath.
          for p in out.rglob("*"):
              if p.is_file() and p.suffix.lower() in {".html", ".js", ".css", ".svg", ".webmanifest"}:
                  try:
                      data = p.read_text()
                      p.write_text(data.replace("/assets/", "/5dollarguy/assets/"))
                  except UnicodeDecodeError:
                      pass
          assert (out / "index.html").stat().st_size > 1000
          assert (out / "assets/world/scene-01.mp4").stat().st_size > 1000
          print("Mirrored", sum(1 for p in out.rglob("*") if p.is_file()), "files")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
