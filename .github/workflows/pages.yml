name: Deploy 5Dollar Guy to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare original production site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          origin = "https://5dollar-guy.higgsfield.app"
          base = "/5dollarguy"
          out = Path("site")
          out.mkdir(exist_ok=True)
          def fetch(url, target):
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["curl", "-fLsS", "--retry", "3", "-A", "Mozilla/5.0", url, "-o", str(target)], check=True)
          # Use the actual published production HTML, not the broken dev-mode HTML committed to the repo.
          fetch(origin + "/", out / "index.html")
          fetch(origin + "/site.webmanifest", out / "site.webmanifest")
          html = (out / "index.html").read_text(encoding="utf-8")
          asset_pattern = re.compile(r"""(?:(?:src|href)=["'])(/assets/[A-Za-z0-9_./?=&%-]+)""")
          # Fetch entry scripts, styles, media and any assets referenced by the HTML or JS/CSS.
          seen = set()
          for _ in range(12):
              refs = set(asset_pattern.findall(html))
              for p in list(out.rglob("*")):
                  if p.is_file() and p.suffix.lower() in {".js", ".css", ".svg", ".webmanifest"}:
                      try:
                          txt = p.read_text(encoding="utf-8", errors="ignore")
                          refs.update(re.findall(r"""(?<![A-Za-z0-9_-])(/assets/[A-Za-z0-9_./?=&%-]+)""", txt))
                          refs.update("/" + x for x in re.findall(r"""(?<![A-Za-z0-9_./-])assets/[A-Za-z0-9_./-]+""", txt))
                      except Exception:
                          pass
              refs = {x.split("?", 1)[0] for x in refs if x.startswith("/assets/")}
              pending = sorted(refs - seen)
              if not pending:
                  break
              for ref in pending:
                  seen.add(ref)
                  target = out / ref.lstrip("/")
                  if target.exists() and target.stat().st_size > 100:
                      continue
                  fetch(origin + ref, target)
          # Ensure animation media and poster frames are present even if referenced dynamically.
          for asset in [
              "/assets/world/scene-01.mp4",
              "/assets/world/scene-01-mobile.mp4",
              "/assets/world/scene-01-desktop-poster.png",
              "/assets/world/scene-01-mobile-poster.png",
          ]:
              target = out / asset.lstrip("/")
              if not target.exists() or target.stat().st_size < 1000:
                  fetch(origin + asset, target)
          # Rebase every root-relative asset path for the GitHub Pages project URL.
          for p in out.rglob("*"):
              if p.is_file() and p.suffix.lower() in {".html", ".js", ".css", ".svg", ".webmanifest"}:
                  txt = p.read_text(encoding="utf-8", errors="ignore")
                  txt = txt.replace("/assets/", base + "/assets/")
                  if p.suffix.lower() == ".html":
                      # TanStack Start's root-mounted hydration is incompatible with GitHub Pages' project subpath.
                      # Keep the server-rendered HTML and run the scroll-scrub video directly, avoiding the hydration crash/flash.
                      script = """<script>
                      (() => {
                        const layer = document.querySelector('[data-scroll-scrub-layer]');
                        const chapter = document.querySelector('[data-scroll-scrub-band]');
                        const stage = document.querySelector('.scroll-scrub__stage');
                        if (!layer || !chapter || !stage) return;
                        const video = document.createElement('video');
                        video.className = 'scroll-scrub__video';
                        video.src = '/5dollarguy/assets/world/scene-01.mp4';
                        video.muted = true; video.playsInline = true; video.preload = 'auto';
                        video.setAttribute('aria-hidden', 'true');
                        layer.appendChild(video);
                        let duration = 0, frame = 0;
                        video.addEventListener('loadedmetadata', () => { duration = video.duration || 0; update(); });
                        video.addEventListener('seeked', () => { if (video.readyState >= 2) layer.setAttribute('data-video-painted', 'true'); });
                        const update = () => {
                          const rect = chapter.getBoundingClientRect();
                          const range = Math.max(1, chapter.offsetHeight - window.innerHeight);
                          const progress = Math.min(1, Math.max(0, -rect.top / range));
                          if (duration > 0 && video.readyState >= 1) {
                            const target = progress * Math.max(0, duration - 0.04);
                            if (Math.abs(video.currentTime - target) > 0.06) {
                              try { video.currentTime = target; } catch (_) {}
                            }
                          }
                          const bar = document.querySelector('.scroll-scrub__progress span');
                          if (bar) bar.style.transform = 'scaleX(' + progress + ')';
                        };
                        const onScroll = () => { if (!frame) frame = requestAnimationFrame(() => { frame = 0; update(); }); };
                        window.addEventListener('scroll', onScroll, { passive: true });
                        window.addEventListener('resize', onScroll);
                        video.addEventListener('error', () => { video.remove(); });
                        update();
                      })();
                      </script>"""
                      txt = re.sub(r'<script type="module" async="" src="/5dollarguy/assets/index-[^"]+\\.js"></script>', script, txt)
                  txt = re.sub(r"""(?<![A-Za-z0-9_./-])assets/([A-Za-z0-9_.-]+\\.(?:js|css))""", base + r"/assets/\\1", txt)
                  txt = txt.replace('href="/site.webmanifest"', 'href="' + base + '/site.webmanifest"')
                  if p.suffix.lower() == ".html":
                      txt = txt.replace("</head>", '<style>a[href*="higgsfield.ai/supercomputer/apps"]{display:none!important}</style></head>')
                  # Remove only the Higgsfield platform badge link, not application UI.
                  p.write_text(txt, encoding="utf-8")
          # Remove a development-only TanStack stream bootstrap if the origin ever includes it.
          index = out / "index.html"
          txt = index.read_text(encoding="utf-8")
          index.write_text(txt, encoding="utf-8")
          assert index.stat().st_size > 10000, "Production HTML did not download correctly"
          assert (out / "assets").exists(), "No production assets were downloaded"
          assert any(out.rglob("*.js")), "No JavaScript bundle was downloaded"
          assert (out / "assets/world/scene-01.mp4").stat().st_size > 100000, "Desktop hero animation is missing"
          print("Prepared production site:", sum(1 for x in out.rglob("*") if x.is_file()), "files")
          print("HTML bytes:", index.stat().st_size)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
